[project]
name = "travel-agent"
version = "0.1.0"
description = "个性化旅游规划系统 MVP"
requires-python = ">=3.11,<3.15"
dependencies = [
    "chromadb>=1.5,<2",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "jieba>=0.42,<0.43",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "mcp>=1.29,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "pymysql>=1.2,<2",
    "redis>=7,<8",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52,<0.53",
    # Security floors for transitive dependencies used by MCP/Chroma.
    "pyjwt[crypto]>=2.15,<3",
    "urllib3>=2.8,<3",
    "oauthlib>=4,<5",
    "multidict>=6.9.1,<7",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
maintenance = [
    "requests>=2.32,<3",
]

dev = [
    "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
